<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Minha Jornada</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#172338;background:#f3f6fa}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:16px}.app{width:min(100%,440px);background:white;border-radius:22px;padding:26px;box-shadow:0 12px 40px #15263d12}h1{font-size:25px;margin:0 0 6px}p{color:#66758b;margin:0 0 24px;font-size:14px}.field{margin:18px 0}label{display:block;font-size:14px;font-weight:650;margin-bottom:9px}.picker{display:flex;align-items:center;gap:10px}.picker select{flex:1;min-width:0;width:0;border:1px solid #ccd7e5;background:#fff;color:#172338;border-radius:13px;padding:14px 10px;font:inherit;font-size:24px;text-align:center;cursor:pointer;appearance:menulist}.picker select:focus{outline:2px solid #a7c8ff;border-color:#397fe8}.picker b{font-size:25px}.result{background:#eaf3ff;border-radius:16px;padding:20px;margin-top:20px}.result small{display:block;color:#43648d;font-size:13px;font-weight:600}.result strong{display:block;color:#1156bd;font-size:44px;margin-top:3px}.divider{height:1px;background:#e8edf4;margin:24px 0 20px}.sub{font-size:18px;margin:0 0 6px}.hint{font-size:13px;color:#78869a;margin-bottom:14px}.return{background:#f3f6fa;border-radius:13px;padding:15px;margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.return span{font-size:14px;color:#526176}.return strong{font-size:25px}.foot{text-align:center;font-size:12px;color:#8390a2;margin-top:24px}.clear{margin-top:10px;background:transparent;border:0;color:#1156bd;cursor:pointer;font:inherit;font-size:13px;padding:7px 0}@media(max-width:380px){.app{padding:20px}.result strong{font-size:38px}}
</style>
</head>
<body><main class="app">
<h1>Minha Jornada</h1><p>Conforme acordo coletivo · Almoço de 1h15</p>
<div class="field"><label>Horário de entrada</label><div class="picker"><select id="entradaHora" aria-label="Hora de entrada"><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08" selected>08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select><b>:</b><select id="entradaMinuto" aria-label="Minuto de entrada"><option value="00" selected>00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div></div>
<section class="result" aria-live="polite"><small>Seu horário de saída</small><strong id="saida">17:15</strong></section>
<div class="divider"></div><h2 class="sub">Intervalo de almoço</h2><div class="hint">Opcional — selecione a hora e os minutos da saída.</div>
<div class="field"><label>Saída para almoço</label><div class="picker"><select id="almocoHora" aria-label="Hora de saída para almoço"><option value="" selected>Hora</option><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option></select><b>:</b><select id="almocoMinuto" aria-label="Minuto de saída para almoço"><option value="" selected>Min</option><option value="00">00</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option><option value="32">32</option><option value="33">33</option><option value="34">34</option><option value="35">35</option><option value="36">36</option><option value="37">37</option><option value="38">38</option><option value="39">39</option><option value="40">40</option><option value="41">41</option><option value="42">42</option><option value="43">43</option><option value="44">44</option><option value="45">45</option><option value="46">46</option><option value="47">47</option><option value="48">48</option><option value="49">49</option><option value="50">50</option><option value="51">51</option><option value="52">52</option><option value="53">53</option><option value="54">54</option><option value="55">55</option><option value="56">56</option><option value="57">57</option><option value="58">58</option><option value="59">59</option></select></div><button class="clear" id="limpar" type="button">Limpar horário de almoço</button></div>
<div class="return" aria-live="polite"><span>Retorno do almoço</span><strong id="retorno">—</strong></div>
<div class="foot">8h de trabalho + 1h15 de intervalo · Conforme acordo coletivo</div>
</main><script>
const $=id=>document.getElementById(id);
function formato(total){const m=((total%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')}
function atualizar(){const entrada=Number($('entradaHora').value)*60+Number($('entradaMinuto').value);$('saida').textContent=formato(entrada+555);const h=$('almocoHora').value,m=$('almocoMinuto').value;$('retorno').textContent=h!==''&&m!==''?formato(Number(h)*60+Number(m)+75):'—'}
['entradaHora','entradaMinuto','almocoHora','almocoMinuto'].forEach(id=>$(id).addEventListener('change',atualizar));
$('limpar').addEventListener('click',()=>{$('almocoHora').value='';$('almocoMinuto').value='';atualizar()});atualizar();
</script></body></html>
